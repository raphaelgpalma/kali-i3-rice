; =============================================================================
; Polybar — tema "Kali Dragon"
; Barra flutuante, translúcida, cores oficiais do Kali Linux
; (extraídas de /usr/share/xfce4/terminal/colorschemes/Kali.theme e
;  /usr/share/qt5ct/colors/Kali-Dark.conf)
; =============================================================================

[colors]
bg           = #cc15171e
bg-alt       = #a6202430
accent       = #367bf0
accent-alt   = #2777ff
teal         = #47d4b9
amber        = #fea44c
red          = #ec0101
text         = #e6e6e6
dim          = #7a8194
border       = #4d367bf0
sep          = #33ffffff

[bar/kali]
monitor = DP-0
width = 97%
height = 62
offset-x = 1.5%
offset-y = 12
radius = 22
fixed-center = true

background = ${colors.bg}
foreground = ${colors.text}

border-size = 2
border-color = ${colors.border}

padding-left = 2
padding-right = 2
module-margin = 1

separator = %{F#33ffffff}   │   %{F-}

dpi = 160
font-0 = JetBrainsMono Nerd Font:style=Bold:size=10;3
font-1 = JetBrainsMono Nerd Font:style=Regular:size=12;3
font-2 = JetBrainsMono Nerd Font:style=Bold:size=13;3

modules-left = kali-logo i3
modules-center = date
modules-right = cpu memory filesystem temperature network pulseaudio tray powermenu

override-redirect = true
wm-restack = i3
enable-ipc = true

cursor-click = pointer

; -----------------------------------------------------------------------------
; Logo Kali
; -----------------------------------------------------------------------------
[module/kali-logo]
type = custom/text
format = "%{T3} %{T-}%{F#e6e6e6} KALI%{F-}"
format-foreground = ${colors.accent}
format-padding = 1

; -----------------------------------------------------------------------------
; Workspaces (i3 nativo)
; -----------------------------------------------------------------------------
[module/i3]
type = internal/i3
pin-workspaces = true
strip-wsnumbers = true
index-sort = true
enable-click = true
enable-scroll = false
wrapping-scroll = false
fuzzy-match = true

label-mode-padding = 2

label-focused = %index%
label-focused-background = ${colors.accent}
label-focused-foreground = #0a0b0f
label-focused-padding = 3
label-focused-margin = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.dim}
label-unfocused-padding = 3
label-unfocused-margin = 1

label-visible = %index%
label-visible-foreground = ${colors.text}
label-visible-padding = 3
label-visible-margin = 1

label-urgent = %index%
label-urgent-background = ${colors.red}
label-urgent-foreground = #ffffff
label-urgent-padding = 3
label-urgent-margin = 1

; -----------------------------------------------------------------------------
; Relógio (centro)
; -----------------------------------------------------------------------------
[module/date]
type = internal/date
interval = 1
date = %a, %d %b
date-alt = %Y-%m-%d
time = %H:%M:%S
time-alt = %H:%M
format = <label>
format-foreground = ${colors.text}
label = "%{T2}%{F#7a8194}%date%%{F-}    %{F#e6e6e6}%time%%{F-}%{T-}"

; -----------------------------------------------------------------------------
; Métricas (direita)
; -----------------------------------------------------------------------------
[module/cpu]
type = internal/cpu
interval = 2
format = <label>
format-padding = 1
label = " %percentage%%"
label-foreground = ${colors.teal}

[module/memory]
type = internal/memory
interval = 3
format = <label>
format-padding = 1
label = "󰍛 %percentage_used%%"
label-foreground = ${colors.accent-alt}

[module/filesystem]
type = internal/fs
interval = 30
mount-0 = /
format-mounted = <label-mounted>
format-padding = 1
label-mounted = "󰋊 %percentage_used%%"
label-mounted-foreground = ${colors.amber}

[module/temperature]
type = internal/temperature
thermal-zone = 0
warn-temperature = 80
interval = 5
format = <label>
format-warn = <label-warn>
format-padding = 1
label = "󰔏 %temperature-c%"
label-warn = "󰔏 %temperature-c%"
label-warn-foreground = ${colors.red}

[module/network]
type = internal/network
interface = wlan0
interval = 3
format-connected = <label-connected>
format-connected-padding = 1
label-connected = "󰈀 %local_ip%"
label-connected-foreground = ${colors.teal}
format-disconnected = <label-disconnected>
format-disconnected-padding = 1
label-disconnected = "󰈂 offline"
label-disconnected-foreground = ${colors.dim}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
format-volume-padding = 1
label-volume = %percentage%%
label-volume-foreground = ${colors.text}
format-muted = <label-muted>
format-muted-padding = 1
label-muted = "󰖁 muted"
label-muted-foreground = ${colors.dim}
ramp-volume-0 = 󰕿
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾
ramp-volume-foreground = ${colors.accent-alt}
click-right = exec pavucontrol &

[module/tray]
type = internal/tray
format-margin = 8
tray-size = 66%
tray-background = ${colors.bg}

; -----------------------------------------------------------------------------
; Power menu
; -----------------------------------------------------------------------------
[module/powermenu]
type = custom/text
format = "⏻"
format-foreground = ${colors.red}
format-padding = 2
click-left = i3-nagbar -t warning -m 'Sair do i3?' -B 'Sim' 'i3-msg exit'

[settings]
screenchange-reload = true
pseudo-transparency = false
